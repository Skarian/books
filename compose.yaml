services:
  proxy:
    image: nginx:alpine
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BOOKS_BIND_ADDR:-127.0.0.1}:${BOOKS_PROXY_PORT:-8000}:8000"
    volumes:
      - ./config/nginx/compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - calibre
      - kosync
      - setup
    restart: unless-stopped

  calibre:
    build:
      context: .
      dockerfile: docker/books/Dockerfile
    image: books-runtime
    security_opt:
      - no-new-privileges:true
    command:
      - calibre-debug
      - -e
      - /app/docker/books/calibre-stored-server.py
      - --
      - --listen-on
      - "0.0.0.0"
      - --port
      - "8080"
      - --enable-auth
      - --auth-mode=basic
      - --userdb
      - /srv/books/config/users.sqlite
      - --log
      - /srv/books/log/calibre.log
      - --access-log
      - /srv/books/log/calibre-access.log
      - --max-log-size
      - "10"
      - --book-list-mode
      - details_list
      - --ignored-fields
      - "#books_users"
      - --max-opds-items
      - "100"
      - --max-opds-ungrouped-items
      - "100"
      - /srv/books/library
    volumes:
      - ${BOOKS_HOST_DATA_DIR:-./data}:/srv/books
    expose:
      - "8080"
    restart: unless-stopped

  kosync:
    image: koreader/kosync@sha256:bb3f13615365703315a43b9059f65e71e876440f867e23a42bf27f2fa18264e1
    security_opt:
      - no-new-privileges:true
    environment:
      ENABLE_USER_REGISTRATION: "true"
    volumes:
      - ${BOOKS_HOST_DATA_DIR:-./data}/kosync/redis:/var/lib/redis
      - ${BOOKS_HOST_DATA_DIR:-./data}/log/kosync/redis:/var/log/redis
      - ${BOOKS_HOST_DATA_DIR:-./data}/log/kosync/app:/app/koreader-sync-server/logs
    expose:
      - "17200"
      - "7200"
    restart: unless-stopped

  worker:
    image: books-runtime
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    command: ["sh", "-lc", "while true; do node src/cli.js hardcover sync; sleep 60; done"]
    volumes:
      - ${BOOKS_HOST_DATA_DIR:-./data}:/srv/books
      - ${BOOKS_HOST_CODEX_HOME:-./data/config/codex-disabled}:/codex-home
    secrets:
      - annas_secret_key
    depends_on:
      - calibre
      - kosync
      - shelfmark
    restart: unless-stopped

  setup:
    image: books-runtime
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    command: ["node", "src/setup-server.js"]
    volumes:
      - ${BOOKS_HOST_DATA_DIR:-./data}:/srv/books
      - ${BOOKS_HOST_CODEX_HOME:-./data/config/codex-disabled}:/codex-home
    expose:
      - "3000"
    restart: unless-stopped

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:1.3.12
    environment:
      PUID: "${BOOKS_SHELFMARK_PUID:-1000}"
      PGID: "${BOOKS_SHELFMARK_PGID:-1000}"
      TZ: "${TZ:-UTC}"
      SEARCH_MODE: direct
      DIRECT_DOWNLOAD_ENABLED: "true"
      DEFAULT_RELEASE_SOURCE: direct_download
      BOOK_LANGUAGE: en
      SUPPORTED_FORMATS: epub
      BOOKS_OUTPUT_MODE: folder
      DESTINATION: /books
      FILE_ORGANIZATION: rename
      TEMPLATE_RENAME: "{Title}"
      AA_BASE_URL: auto
      AA_MIRROR_URLS: "https://annas-archive.gl,https://annas-archive.pk,https://annas-archive.gd"
      USE_CF_BYPASS: "true"
    command: ["sh", "/books-shelfmark-entrypoint.sh"]
    expose:
      - "8084"
    volumes:
      - ${BOOKS_HOST_DATA_DIR:-./data}/shelfmark/config:/config
      - ${BOOKS_HOST_DATA_DIR:-./data}/shelfmark/downloads:/books
      - ./docker/shelfmark/entrypoint.sh:/books-shelfmark-entrypoint.sh:ro
    secrets:
      - annas_secret_key
    restart: unless-stopped

  admin:
    image: books-runtime
    security_opt:
      - no-new-privileges:true
    profiles: ["admin"]
    env_file:
      - .env
    volumes:
      - ${BOOKS_HOST_DATA_DIR:-./data}:/srv/books
      - ${BOOKS_HOST_CODEX_HOME:-./data/config/codex-disabled}:/codex-home
    secrets:
      - annas_secret_key
    entrypoint: ["/app/docker/books/entrypoint.sh", "/app/src/cli.js"]
    command: ["--help"]

secrets:
  annas_secret_key:
    file: ./secrets/annas_secret_key
